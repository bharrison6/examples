<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --card-back: #2a3550;
    --card-face: #e8ecf4;
    --text: #e8ecf4;
    --muted: #93a0b8;
    --accent: #5b9dff;
    --matched: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
  }
  h1 { font-size: 1.5rem; }
  .hud {
    display: flex;
    gap: 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .hud b { color: var(--text); }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 84px);
    gap: 12px;
  }
  .card {
    width: 84px;
    height: 84px;
    perspective: 500px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.35s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    backface-visibility: hidden;
    font-size: 2rem;
    user-select: none;
  }
  .face.back {
    background: var(--card-back);
    border: 1px solid #3a4a70;
  }
  .face.back::after {
    content: "?";
    color: var(--muted);
    font-size: 1.5rem;
    font-weight: 700;
  }
  .face.front {
    background: var(--card-face);
    transform: rotateY(180deg);
  }
  .card.matched .face.front {
    background: var(--matched);
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
  }
  button {
    background: var(--accent);
    color: #0b1020;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 9px 22px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .win {
    color: var(--matched);
    font-weight: 600;
    min-height: 1.4em;
  }
  a.back-link { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
  a.back-link:hover { color: var(--accent); }
</style>
</head>
<body>
  <h1>🃏 Memory Match</h1>
  <div class="hud">
    <span>Moves: <b id="moves">0</b></span>
    <span>Time: <b id="time">0:00</b></span>
    <span>Pairs: <b id="pairs">0/8</b></span>
  </div>
  <div class="board" id="board"></div>
  <div class="win" id="winMsg"></div>
  <button id="resetBtn">New game</button>
  <a class="back-link" href="../index.html">← back to demos</a>

<script>
(() => {
  const EMOJI = ['🍎','🚀','🎸','🐙','🌵','⚽','🎲','🔑'];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const pairsEl = document.getElementById('pairs');
  const winMsg = document.getElementById('winMsg');
  const resetBtn = document.getElementById('resetBtn');

  let first = null, lock = false, moves = 0, matched = 0, seconds = 0, timer = null, started = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function fmtTime(s) {
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function startTimer() {
    if (started) return;
    started = true;
    timer = setInterval(() => {
      seconds++;
      timeEl.textContent = fmtTime(seconds);
    }, 1000);
  }

  function build() {
    clearInterval(timer);
    first = null; lock = false; moves = 0; matched = 0; seconds = 0; started = false;
    movesEl.textContent = '0';
    timeEl.textContent = '0:00';
    pairsEl.textContent = '0/8';
    winMsg.textContent = '';
    board.innerHTML = '';

    const deck = shuffle([...EMOJI, ...EMOJI]);
    deck.forEach(sym => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.sym = sym;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back"></div>
          <div class="face front">${sym}</div>
        </div>`;
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    startTimer();
    card.classList.add('flipped');

    if (!first) {
      first = card;
      return;
    }

    moves++;
    movesEl.textContent = moves;

    if (first.dataset.sym === card.dataset.sym) {
      first.classList.add('matched');
      card.classList.add('matched');
      first.classList.remove('flipped');
      card.classList.remove('flipped');
      first = null;
      matched++;
      pairsEl.textContent = matched + '/8';
      if (matched === EMOJI.length) {
        clearInterval(timer);
        winMsg.textContent = `🎉 Solved in ${moves} moves and ${fmtTime(seconds)}!`;
      }
    } else {
      lock = true;
      const a = first;
      first = null;
      setTimeout(() => {
        a.classList.remove('flipped');
        card.classList.remove('flipped');
        lock = false;
      }, 800);
    }
  }

  resetBtn.addEventListener('click', build);
  build();
})();
</script>
</body>
</html>
