<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nine Board Tic Tac Toe</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23101215'/%3E%3Cpath d='M18 18 46 46M46 18 18 46' stroke='%234fd5c6' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game" aria-labelledby="game-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Best of nine boards</p>
            <h1 id="game-title">Nine Board Tic Tac Toe</h1>
          </div>

          <div class="controls" aria-label="Game controls">
            <div class="segmented" role="group" aria-label="Game mode">
              <button class="mode-button is-active" type="button" data-mode="cpu">
                Vs CPU
              </button>
              <button class="mode-button" type="button" data-mode="local">
                Pass & Play
              </button>
            </div>
            <button class="icon-button" type="button" id="new-match" aria-label="Start new match">
              ↻
            </button>
          </div>
        </div>

        <div class="scoreboard" aria-label="Scoreboard">
          <div class="score-item">
            <span class="score-label">X Boards</span>
            <strong id="x-score">0</strong>
          </div>
          <div class="score-item">
            <span class="score-label">Drawn</span>
            <strong id="draw-score">0</strong>
          </div>
          <div class="score-item">
            <span class="score-label">O Boards</span>
            <strong id="o-score">0</strong>
          </div>
        </div>

        <div class="stage">
          <div class="board-grid" id="board-grid" role="group" aria-label="Nine Tic Tac Toe boards"></div>
        </div>

        <div class="footerbar">
          <p class="status" id="status" aria-live="polite">X to move</p>
          <button class="text-button" type="button" id="new-match-text">New Match</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
