<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --text: #e8ecf4;
    --muted: #93a0b8;
    --accent: #5b9dff;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #f87171;
    --grid-line: #1c2537;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  h1 { font-size: 1.5rem; }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .hud b { color: var(--text); }
  canvas {
    background: var(--panel);
    border: 2px solid #2a3550;
    border-radius: 8px;
  }
  .controls { color: var(--muted); font-size: 0.85rem; text-align: center; line-height: 1.6; }
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 24, 0.75);
  }
  .overlay.show { display: flex; }
  .overlay .box {
    background: var(--panel);
    border: 1px solid #2a3550;
    border-radius: 12px;
    padding: 32px 40px;
    text-align: center;
  }
  .overlay h2 { margin-bottom: 8px; }
  .overlay p { color: var(--muted); margin-bottom: 20px; }
  button {
    background: var(--accent);
    color: #0b1020;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  a.back { color: var(--muted); font-size: 0.8rem; text-decoration: none; }
  a.back:hover { color: var(--accent); }
</style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Speed: <b id="speed">1</b></span>
  </div>
  <canvas id="game" width="420" height="420"></canvas>
  <div class="controls">
    Arrow keys or WASD to steer · Space to pause<br>
    Eat food to grow — the game speeds up every 5 points.
  </div>
  <a class="back" href="../index.html">← back to demos</a>

  <div class="overlay" id="overlay">
    <div class="box">
      <h2 id="overlayTitle">Snake</h2>
      <p id="overlayMsg">Press start to play.</p>
      <button id="startBtn">Start</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const CELL = 21;                       // cells per side
  const SIZE = canvas.width / CELL;      // pixel size per cell

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const startBtn = document.getElementById('startBtn');

  let snake, dir, nextDir, food, score, best = 0, tickMs, timer = null, paused = false, running = false;

  function reset() {
    const mid = Math.floor(CELL / 2);
    snake = [{x: mid - 1, y: mid}, {x: mid - 2, y: mid}, {x: mid - 3, y: mid}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    tickMs = 140;
    paused = false;
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * CELL),
        y: Math.floor(Math.random() * CELL)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    speedEl.textContent = Math.round((140 - tickMs) / 12) + 1;
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall or self collision
    if (head.x < 0 || head.y < 0 || head.x >= CELL || head.y >= CELL ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      best = Math.max(best, score);
      if (score % 5 === 0 && tickMs > 60) {
        tickMs -= 12;
        restartTimer();
      }
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let i = 1; i < CELL; i++) {
      ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
    }

    // food
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    ctx.beginPath();
    ctx.arc((food.x + 0.5) * SIZE, (food.y + 0.5) * SIZE, SIZE * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // snake
    const bodyColor = getComputedStyle(document.documentElement).getPropertyValue('--snake');
    const headColor = getComputedStyle(document.documentElement).getPropertyValue('--snake-head');
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? headColor : bodyColor;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(s.x * SIZE + pad, s.y * SIZE + pad, SIZE - pad * 2, SIZE - pad * 2);
    });
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(() => { if (!paused) tick(); }, tickMs);
  }

  function start() {
    reset();
    overlay.classList.remove('show');
    running = true;
    draw();
    restartTimer();
  }

  function gameOver() {
    clearInterval(timer);
    running = false;
    overlayTitle.textContent = 'Game over';
    overlayMsg.textContent = `You scored ${score}. Best this session: ${best}.`;
    startBtn.textContent = 'Play again';
    overlay.classList.add('show');
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup: {x: 0, y: -1},   w: {x: 0, y: -1},
      arrowdown: {x: 0, y: 1},  s: {x: 0, y: 1},
      arrowleft: {x: -1, y: 0}, a: {x: -1, y: 0},
      arrowright: {x: 1, y: 0}, d: {x: 1, y: 0}
    };
    if (map[k]) {
      e.preventDefault();
      const nd = map[k];
      // disallow reversing into yourself
      if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
    } else if (k === ' ' && running) {
      e.preventDefault();
      paused = !paused;
    }
  });

  startBtn.addEventListener('click', start);
  overlay.classList.add('show');
  reset();
  draw();
})();
</script>
</body>
</html>
